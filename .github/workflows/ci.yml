name: Secure Software DevSecOps CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  static-security-analysis:
    name: SAST Security Scan (Bandit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11 Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies & Bandit Scanner
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit

      - name: Execute Bandit SAST Scan
        run: |
          bandit -r backend/ -ll -v

  automated-testing-and-concurrency:
    name: Automated Unit, Integration & Concurrency Tests
    runs-on: ubuntu-latest
    needs: static-security-analysis
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11 Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test Suite (Unit, Integration, Fuzzing & Race Condition)
        run: |
          python -m pytest tests/ -v

  container-build-and-package:
    name: Container Build & Verification
    runs-on: ubuntu-latest
    needs: automated-testing-and-concurrency
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Hardened Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: phanichandan02/booking-system:${{ github.sha }},phanichandan02/booking-system:latest
